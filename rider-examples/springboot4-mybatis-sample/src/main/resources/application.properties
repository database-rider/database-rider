# ===============================
# = DATA SOURCE
# ===============================
#user datasource
user.datasource.driver-class-name = net.sf.log4jdbc.sql.jdbcapi.DriverSpy
user.datasource.url = jdbc:log4jdbc:postgresql://127.0.0.1:5432/userdb
user.datasource.username = sa
user.datasource.password =
user.datasource.testWhileIdle = true
user.datasource.validationQuery = SELECT 1
user.datasource.configuration.maximum-pool-size = 1
user.datasource.configuration.leakDetectionThreshold = 10000
user.datasource.configuration.auto-commit = false
user.datasource.configuration.transaction-isolation = TRANSACTION_READ_COMMITTED

#company datasource
company.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
company.datasource.url = jdbc:log4jdbc:postgresql://127.0.0.1:5432/companydb
company.datasource.username = sa
company.datasource.password =
company.datasource.testWhileIdle = true
company.datasource.validationQuery = SELECT 1
company.datasource.configuration.maximum-pool-size = 1
company.datasource.configuration.leakDetectionThreshold=10000

# ===============================
# = LOGGING
# ===============================
logging.level.root = warn
logging.level.com.github.database.rider = info
logging.level.com.zaxxer.hikari = info
logging.level.org.dbunit.database = info
logging.level.org.springframework.boot.jdbc = info
logging.level.org.springframework.boot.transaction = info
logging.level.org.springframework.jdbc = info
logging.level.org.springframework.transaction = info
logging.level.cyou.oblique_rays.stomp = info

logging.level.jdbc = off
logging.level.jdbc.sqlonly = debug
logging.level.jdbc.sqltiming = off
logging.level.jdbc.audit = debug
logging.level.jdbc.resultset = off
logging.level.jdbc.resultsettable = info
logging.level.jdbc.connection = debug
